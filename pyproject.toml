[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-fittings"
version = "2.0.0"
description = "Industrial geometric engine for all 87 SMACNA HVAC duct fittings – isometric renderer, themes, export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hvac", "smacna", "ductwork", "fittings", "geometric-engine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]